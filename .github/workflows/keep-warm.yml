# Keeps the Neon database awake during review hours only (docs/FREE_STACK.md §3 — CU-hour budget).
# Set the repository variable APP_URL (Settings → Secrets and variables → Actions → Variables) to the deployed
# web app, e.g. https://samepinch.vercel.app. Until it's set there's nothing to keep warm, so the job skips
# instead of failing every five minutes.
name: keep-warm
on:
  schedule:
    - cron: "*/5 3-15 * * 1-5" # 08:30–21:25 IST, weekdays
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API health check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::APP_URL is not set yet (no deployment to keep warm). Skipping."
            exit 0
          fi
          # A sleeping Neon branch can take a few seconds to wake: retry before calling it a failure.
          curl -fsS --retry 4 --retry-delay 5 --retry-all-errors --max-time 20 "${APP_URL%/}/api/v1/health" > /dev/null
          echo "Healthy: ${APP_URL%/}/api/v1/health"
