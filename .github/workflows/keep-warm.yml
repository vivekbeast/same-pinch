# Keeps the Neon database awake during review hours only (docs/FREE_STACK.md §3 — CU-hour budget).
name: keep-warm
on:
  schedule:
    - cron: "*/5 3-15 * * 1-5" # 08:30–21:25 IST, weekdays
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ vars.APP_URL }}/api/v1/health" > /dev/null
