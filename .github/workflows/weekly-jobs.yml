# Weekly housekeeping: old events, rate-limit windows, expired sessions (docs/DATA_MODEL.md §4).
# Needs the repository variable APP_URL and the secret JOBS_SECRET; skips (doesn't fail) until both exist.
name: weekly-jobs
on:
  schedule:
    - cron: "0 22 * * 0" # Mondays 03:30 IST
  workflow_dispatch:
permissions: {}
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Prune old data
        env:
          APP_URL: ${{ vars.APP_URL }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$JOBS_SECRET" ]; then
            echo "::notice::APP_URL or JOBS_SECRET is not set yet (no deployment). Skipping."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 60 -X POST \
            -H "Authorization: Bearer $JOBS_SECRET" "${APP_URL%/}/api/v1/jobs/prune"
