name: samepinch
services:
  db:
    image: postgres:16-alpine
    container_name: samepinch-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: samepinch
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samepinch"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
